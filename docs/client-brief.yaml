# -----------------------------------------------------------------------------
# 6. VISUAL DIRECTION
# =============================================================================
# Source: client instruction ("Rocky Balboa style — gri cu alb, direcție
# metalică, accente mici de roșu") + Daniel Rohnean poster (dark background,
# high-contrast fight photography, red accent text).
#
# Rocky Balboa visual reference: gritty, cinematic, masculine, earned —
# not glossy or corporate. Raw concrete + metal + sweat + championship.
# Think: dark grey concrete texture, metallic silver highlights, deep red
# accents used sparingly, high-contrast black/white photography.
# -----------------------------------------------------------------------------
visual:
  reference: "Rocky Balboa film aesthetic — grey, white, metallic, red accents"
  reference_url: ""          # No external site reference provided — build from
                             # the visual description and Daniel Rohnean poster.

  vibe: "gritty championship — dark metallic grey, earned through discipline,
         raw but precise. Rocky Balboa meets modern fight sports branding."

  structure: "one-pager"     # Confirmed by client.

  # --- COLOR PALETTE ---
  background_color: "#1C1C1E"
                             # Deep charcoal — not pure black. Feels like
                             # concrete / aged metal. Dominant page background.

  secondary_background: "#2C2C2E"
                             # Slightly lighter charcoal for alternating
                             # section backgrounds — creates depth without
                             # breaking the dark theme.

  brand_color: "#C0C0C0"    # Metallic silver — primary accent for headings,
                             # borders, and decorative elements. Sampled from
                             # the metallic/gritty direction requested.
                             # Use as the "shine" on the dark background.

  accent_color: "#C0392B"   # Deep championship red — used SPARINGLY.
                             # Only for: primary CTA button, key stat numbers
                             # (2x vicecampion, 1 campion mondial format),
                             # and the single most important word in each
                             # section headline. Never as a background color.

  text_color: "#F0F0F0"     # Off-white — body text. Not pure white (too harsh
                             # against dark backgrounds). Warm enough to read
                             # comfortably.

  text_muted: "#8E8E93"     # Muted grey — for secondary labels, captions,
                             # and supporting text. Keeps hierarchy clean.

  # --- TEXTURE DIRECTION ---
  texture:
    concept: "Metallic + concrete — two layers throughout the site"
    layers:
      - name: "Concrete grain"
        description: >
          Fine noise/grain texture overlay at 6–10% opacity on dark backgrounds.
          Prevents flat digital look — makes the page feel physical, earned.
          CSS: SVG feTurbulence or subtle noise PNG overlay.
      - name: "Metallic sheen"
        description: >
          Linear gradient on section headers and the hero title:
          silver → white → silver, left to right, like light catching metal.
          Applied to large display text only — not body copy.
          CSS: background-clip: text with metallic gradient.
      - name: "Red underline / strike"
        description: >
          Single-pixel red horizontal line used as a section divider and
          as an underline accent on the most important word in hero headlines.
          The ONLY place red appears in body sections (besides the CTA button).

  # --- TYPOGRAPHY ---
  typography:
    display: "condensed bold — Impact, Bebas Neue, or Anton"
                             # Daniel Rohnean poster (screenshot) uses a bold
                             # condensed sport typeface for "ROHNEAN DANIEL"
                             # and the red accent text. Apply same system to
                             # Robert's page. Wide tracking on ALL-CAPS labels.
    body: "clean sans-serif — Inter, Roboto, or similar"
                             # Readable at all sizes, light weight on dark bg.
    accent: "none"           # No script fonts — inconsistent with Rocky/fight
                             # aesthetic. Hard edges only.
    sizing:
      hero_title: "clamp(3rem, 8vw, 7rem) — massive, cinematic"
      section_title: "clamp(2rem, 4vw, 3.5rem)"
      body: "1rem / 1.6 line-height"
      stat_number: "clamp(3rem, 6vw, 5rem) — bold, red accent"

  # --- ONE-PAGER SECTIONS WITH CONTENT & IMAGE PLACEMENT ---
  sections:

    - id: "hero"
      title_ro: null
      title_en: null
      layout: >
        Full-viewport. Dark background with concrete grain texture.
        Robert's name in massive metallic condensed type, centered or
        left-aligned. Tagline below. Red CTA button. Photography full-bleed
        behind with dark overlay (70% opacity) so text reads clearly.
      image:
        description: "Fight/training photo of Robert — ideally mid-action or
                       authoritative stance. Request high-res from client.
                       Daniel Rohnean poster style is the visual reference."
        placement: "Full-bleed background, 70% dark overlay"
        animation: "Slow zoom out (scale 1.08 → 1.0) over 6s — cinematic
                    Ken Burns effect. Headline fades in after 300ms."
      copy_ro:
        headline: "DISCIPLINA CARE FACE CAMPIONI"
        subheadline: "Vicecampion Mondial Kickboxing · Antrenor al Campionului Mondial WKF"
        cta: "Începe Antrenamentul"
      copy_en:
        headline: "THE DISCIPLINE THAT MAKES CHAMPIONS"
        subheadline: "Kickboxing World Vice-Champion · Coach of the WKF World Champion"
        cta: "Start Training"
      animation:
        - "Name slides in from left, 600ms cubic-bezier(0.22,1,0.36,1)"
        - "Credentials fade in below, delay 300ms"
        - "CTA button scales up from 0.9, delay 500ms, then red pulse glow at idle"

    - id: "credentials"
      title_ro: "PALMARES"
      title_en: "ACHIEVEMENTS"
      layout: >
        Full-width dark section. Three stat blocks side by side — large red
        number, metallic label below. Concrete texture background.
        Simple, punchy, impossible to miss.
      stats:
        - number: "2×"
          label_ro: "Vicecampion Mondial & European"
          label_en: "World & European Vice-Champion"
        - number: "1"
          label_ro: "Campion Mondial format (Daniel Rohnean, WKF 2021)"
          label_en: "World Champion coached (Daniel Rohnean, WKF 2021)"
        - number: "9+"
          label_ro: "Ani de antrenat campioni"
          label_en: "Years coaching champions"
      animation: "Numbers count up from 0 on first viewport entry, 800ms"

    - id: "about"
      title_ro: "POVESTEA"
      title_en: "THE STORY"
      layout: >
        Two-column: photo left, text right. Slightly lighter dark background
        (#2C2C2E) to break from hero. Red thin vertical line separator
        between photo and text column.
      image:
        description: "Portrait of Robert — authoritative, not smiling broadly.
                       Arms crossed or holding gloves. Dark background."
        placement: "Left column, 45% width. No border — bleeds to edge."
        animation: "Slide in from left, fade, 500ms on scroll entry."
      copy_source_ro: >
        Use condensed version of the elitaromaniei.ro article narrative —
        confirm with Robert which parts he wants highlighted:
        Box din vârsta de 12 ani → Kickboxing → Vicecampion Mondial →
        Fondarea Academiei 2015 → Daniel Rohnean campion mondial 2021.
        Voice: first person, direct, no fluff.
        Key quote to feature: "Motivația dispare... dar cu disciplina poți
        persevera."
      copy_source_en: "Translated version of the same narrative."

    - id: "disciplines"
      title_ro: "DISCIPLINE"
      title_en: "DISCIPLINES"
      layout: >
        3-column card grid on desktop, 1-column on mobile. Each card:
        dark background, metallic border on hover, discipline name in
        condensed bold, short description, red arrow icon. Concrete texture.
      cards:
        - "Kickboxing"
        - "Box / Boxing"
        - "TRX & Antrenament Personal / Personal Training"
        - "Copii & Juniori / Kids & Juniors"
        - "Pregătire Competițională / Competition Prep"
        - "Muay Thai [PLACEHOLDER — confirmare cu clientul]"
      hover_interaction: >
        On hover: metallic silver border appears, background lightens slightly
        to #2C2C2E, red accent arrow shifts right 4px. 150ms ease.
      animation: "Cards stagger fade-in + translateY(20px→0), 80ms between each"

    - id: "daniel_rohnean"
      title_ro: "UN ELEV. UN CAMPION MONDIAL."
      title_en: "ONE STUDENT. ONE WORLD CHAMPION."
      layout: >
        Split section — darker background (#111). Daniel Rohnean poster
        image left (full height), story text right. Red accent on his name.
        This is the strongest trust proof on the page — give it full visual
        weight.
      image:
        file: "Daniel Rohnean promotional poster (from client screenshot)"
        placement: "Left half of section, full height, slight red tint overlay
                    on the poster to integrate it into the site palette."
        animation: "Fade in + scale 1.04→1.0, 600ms."
      copy_ro: >
        Daniel Rohnean a început antrenamentele la Academia Robert Turda
        în 2018, la vârsta de 10 ani. În octombrie 2021, la 13 ani,
        a cucerit titlul de Campion Mondial WKF la juniori (categoria 54kg)
        la Cairo, Egipt — câștigând finala în fața unui sportiv gazdă.
      copy_en: >
        Daniel Rohnean began training at Academia Robert Turda in 2018,
        aged 10. In October 2021, at 13 years old, he became WKF Junior
        World Champion (54kg) in Cairo, Egypt — winning the final against
        a home-country athlete.

    - id: "contact_cta"
      title_ro: "ÎNCEPE AZI"
      title_en: "START TODAY"
      layout: >
        Full-width. Darkest section (#111 or pure #000). Centered.
        Large condensed headline, red CTA button, phone + social links below.
        Single red horizontal line at top as divider.
      copy_ro:
        headline: "PRIMUL PAS SPRE CAMPIONAT ÎNCEPE ACUM"
        subheadline: "Kickboxing · Box · TRX · Antrenament Personal — Sighetu Marmației & Ocna Șugatag"
        cta_primary: "Sună Acum"
        cta_secondary: "sau scrie pe Facebook"
      copy_en:
        headline: "THE FIRST STEP TOWARD CHAMPIONSHIP STARTS NOW"
        subheadline: "Kickboxing · Boxing · TRX · Personal Training — Sighetu Marmației & Ocna Șugatag"
        cta_primary: "Call Now"
        cta_secondary: "or message on Facebook"
      phone_display: "0741 541 473"
      animation: >
        Headline fades in + scale 0.96→1.0. CTA red button pulses at idle.
        On hover: white text on red bg → red text on white bg, 150ms.
        On press: scale 0.97x, 80ms.

  # --- GLOBAL ANIMATIONS ---
  animations:
    philosophy: >
      Cinematic and precise — like a fight. Movements are deliberate,
      fast, and land with weight. No bouncing, no playful easing.
      Every animation should feel like a jab: sharp in, clean out.
    scroll_reveal:
      type: "fade-in + translateY(24px → 0)"
      duration: "500ms"
      easing: "cubic-bezier(0.22, 1, 0.36, 1)"
      trigger: "IntersectionObserver, threshold 0.12"
    hover:
      buttons: "color swap, 150ms ease — no gradients, just a clean switch"
      cards: "border appear + slight background lift, 150ms"
      nav: "red underline draws left to right, 200ms"
    press:
      all: "scale 0.97x, 80ms — snappy physical feedback"
    page_load:
      sequence: >
        1. Background texture fades in (200ms)
        2. Hero image Ken Burns starts
        3. Name slides in from left (600ms)
        4. Credentials line fades in (delay 300ms)
        5. CTA button scales up (delay 500ms)
        6. Idle pulse on CTA begins


