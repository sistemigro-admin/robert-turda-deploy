# -----------------------------------------------------------------------------
# 4. POSITIONING
# =============================================================================
# Built from confirmed data: elitaromaniei.ro article (2021) + screenshot.
#
# The differentiator is unusually strong and specific — Caples principle:
# specificity = credibility. Robert is not "an experienced trainer." He is:
# - Vicecampion mondial kickboxing (Cairo, 2021, cat. 91kg)
# - Vicecampion european kickboxing (Baia Mare, 2019)
# - Antrenor al lui Daniel Rohnean — campion mondial WKF juniori 2021
# - Activ din 2015 ca antrenor, Academia Robert Turda fondată la Sighetu
#   Marmației și Ocna Șugatag
# - Disciplines: Box (din vârsta de 12 ani), Kickboxing, TRX, personal trainer
#
# Made to Stick (Concrete): "a format campioni mondiali" este o afirmație
# verificabilă și rară — nu un slogan generic. Aceasta este ancora centrală
# a întregii pagini.
#
# Fortune Cookie Principle: diferențiatorul real nu este "pasiune și dedicare"
# (orice antrenor spune asta) — este dovada concretă: un elev campion mondial
# la 13 ani, antrenorul însuși vicecampion mondial.
# -----------------------------------------------------------------------------
positioning:
  audience_ro: >
    Trei publicuri simultane — fiecare cu motivație diferită:
    (1) Părinți din Sighetu Marmației / Ocna Șugatag care vor să înscrie
    copiii la un sport serios, cu un antrenor care produce rezultate reale.
    (2) Adulți care vor antrenament personal eficient — fitness, TRX,
    pierdere în greutate sau condiție fizică generală.
    (3) Sportivi amatori sau de performanță care vor să avanseze în kickboxing
    sau box sub îndrumarea unui antrenor cu palmares internațional.

  audience_en: >
    Three simultaneous audiences:
    (1) Parents from Sighetu Marmației / Ocna Șugatag looking to enroll their
    kids in a serious sport with a coach who delivers real results.
    (2) Adults seeking effective personal training — fitness, TRX, weight loss
    or general conditioning.
    (3) Amateur or competitive athletes looking to advance in kickboxing or
    boxing under a coach with international credentials.

  benefits:
    - ro: "Vicecampion mondial kickboxing (Cairo 2021, cat. 91kg) — nu e un titlu de perete, e dovada că știe ce predă"
      en: "World kickboxing vice-champion (Cairo 2021, 91kg) — not a wall title, proof he knows what he teaches"
    - ro: "A antrenat Daniel Rohnean — campion mondial WKF juniori 2021, la 13 ani"
      en: "Coached Daniel Rohnean — WKF junior world champion 2021, aged 13"
    - ro: "Disciplinele predate: Kickboxing, Box, Muay Thai, TRX, fitness, circuite — totul într-o singură academie"
      en: "Disciplines taught: Kickboxing, Boxing, Muay Thai, TRX, fitness, circuits — all in one academy"
    - ro: "Activ din 2015 ca antrenor — nu un proiect nou, o academie cu istoric și rezultate demonstrabile"
      en: "Active as a coach since 2015 — not a new project, an academy with history and demonstrable results"
    - ro: "Accesibil tuturor vârstelor și nivelurilor — de la primul pumn la campionat mondial"
      en: "Accessible to all ages and levels — from the first punch to world championship"

  key_quote_ro: >
    "Motivația dispare în două, trei săptămâni, maxim o lună, însă cu
    disciplina poți persevera în continuare!"
    — Robert Turda (elitaromaniei.ro, 2021)
                             # Use this as a hero quote or section break.
                             # It captures the entire training philosophy in
                             # one sentence — confirm with Robert that he's
                             # comfortable with it being used on the site.
  key_quote_en: >
    "Motivation fades in two or three weeks, maybe a month — but discipline
    keeps you going."
    — Robert Turda


